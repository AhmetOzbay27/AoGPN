name: publish GPG public key

# Ortak anahtarı (AoGPN-public-key.asc) bir sürüme yükler.
#
# Bu iş akışı ARTIK ÜRETİMİN KENDİSİ DEĞİLDİR: gövdesi, release.yml'in imzalama
# işiyle ortak olan tek uygulamayı (.github/actions/publish-public-key) çağırır.
# Böylece AoGPN-public-key.asc'in tek bir tanımı olur; aynı varlık adını iki ayrı
# kod yolunun beslemesi (ve zamanla ayrışması) imkânsızdır.
#
# Eski gövde `svenstaro/upload-release-action@v2` ile ve `prerelease: true`
# bayrağıyla yüklüyordu. Sürüm yoksa o bayrak yayını ÖN SÜRÜM olarak açar ve
# uygulama güncellemeyi /releases/latest ucundan okuduğu için hiç görmez. Ortak
# uygulama bu yüzden yalnızca gh kullanır ve sürümü ön sürüm olarak açmaz.

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        # Zorunlu DEĞİL: anahtar tanımlı değilse çağıran iş akışı kırılmaz,
        # ortak uygulama yalnızca bir uyarı bırakıp atlar.
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Ortak anahtarın yükleneceği sürüm etiketi (ör. v1.1.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Publish GPG public key
      uses: ./.github/actions/publish-public-key
      with:
        release-tag: ${{ inputs.release_tag }}
        private-key: ${{ secrets.GPG_PRIVATE_KEY }}
