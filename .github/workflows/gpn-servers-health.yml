name: GPN servers health

# Canlı İtalya/Almanya WireGuard sunucularını GpnProbeTool ile ölçüp
# sonucu JSONL olarak toplar; hiçbir sunucuya UDP yolu doğrulanamazsa iş başarısız
# olur ve (tanımlıysa) webhook ile bildirilir — GpnProbeTool'un --jsonl / --webhook
# çıktısıyla entegre bir health-notifier CI'ı.
#
# ÖLÇÜLMÜŞ KISIT — bu iş akışının bir kez bile çalışmamasının nedeni:
# `secrets` bağlamı `if` koşullarında KULLANILAMAZ. Kullanıldığında GitHub iş
# akışını "Unrecognized named-value: 'secrets'" ile GEÇERSİZ sayar ve koşum hiç iş
# oluşturmadan kırılır (bu dosyada 7 koşumun 7'si böyle düştü). Bu yüzden
# secret'lar aşağıda ortam değişkenlerine alınır ve koşullar `env.*` üzerinden
# kurulur. Değerler çalışma zamanında GitHub tarafından loglarda maskelenir.

on:
  schedule:
    # Her 30 dakikada bir (UTC).
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - 'AoGPN/AoGPN.GpnProbeTool/**'
      - '.github/workflows/gpn-servers-health.yml'

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # `if:` koşullarında okunabilmeleri için secret'lar env'e taşınır (yukarıdaki nota bakın).
  ITALY_CONF_B64: ${{ secrets.ITALY_CONF_B64 }}
  GERMANY_CONF_B64: ${{ secrets.GERMANY_CONF_B64 }}
  GPN_WEBHOOK_URL: ${{ secrets.GPN_WEBHOOK_URL }}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Kapı adımı: ölçüm yapılabilir mi? Secret'lar tanımlı değilse hiçbir adım
      # çalışmaz, iş YEŞİL kalır ve neden atlandığı bir notice olarak bildirilir.
      # (İş seviyesinde `if` ile yapılamaz: orada `env` bağlamı da yoktur.)
      - name: Check for probe secrets
        id: gate
        shell: bash
        run: |
          if [[ -n "${ITALY_CONF_B64:-}" && -n "${GERMANY_CONF_B64:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sunucu saglik olcumu atlandi::ITALY_CONF_B64 ve GERMANY_CONF_B64 tanimli degil; canli sunucu olcumu yapilmadi ve is yesil birakildi."
          fi

      - name: Checkout
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Setup .NET
        if: steps.gate.outputs.present == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # WireGuard istemci özel anahtarları GİZLİ olduğundan conf'lar repoda değil,
      # secret'ların base64'ünden geçici dosyaya açılır (iş bittiğinde runner yok olur).
      # `printf` kullanılır: `echo` secret'ın sonuna satır sonu ekler ve base64
      # çözümlemesini bozabilir.
      - name: Materialize WireGuard confs (secrets)
        id: confs
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          printf '%s' "$ITALY_CONF_B64" | base64 -d > "$RUNNER_TEMP/italy.conf"
          printf '%s' "$GERMANY_CONF_B64" | base64 -d > "$RUNNER_TEMP/germany.conf"
          test -s "$RUNNER_TEMP/italy.conf" && test -s "$RUNNER_TEMP/germany.conf"
          echo "confs=$RUNNER_TEMP/italy.conf $RUNNER_TEMP/germany.conf" >> "$GITHUB_OUTPUT"

      - name: Probe live servers (JSONL)
        id: probe
        if: steps.gate.outputs.present == 'true'
        shell: bash
        env:
          CONFS: ${{ steps.confs.outputs.confs }}
        run: |
          set +e
          read -r -a conf_args <<< "$CONFS"
          dotnet run --project AoGPN/AoGPN.GpnProbeTool -- \
            --jsonl \
            --timeout-ms 2500 --samples 2 \
            --webhook "${GPN_WEBHOOK_URL:-}" \
            "${conf_args[@]}" \
            | tee /tmp/gpn-probe.jsonl
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Print health summary
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          grep '"event":"summary"' /tmp/gpn-probe.jsonl | head -1 || echo "(no summary JSONL emitted)"

      # Koşul "boş değil VE 0 değil" diye kurulur: probe atlandığında çıktı boş
      # kalır ve yalnızca "0 değil" kontrolü atlanan ölçümü haksız yere kırardı.
      - name: Fail if no UDP path reachable
        if: steps.gate.outputs.present == 'true' && steps.probe.outputs.code != '' && steps.probe.outputs.code != '0'
        run: |
          echo "::error::Hiçbir sunucuya UDP yolu doğrulanamadı (exit=${{ steps.probe.outputs.code }})."
          exit 1

      # Opsiyonel notifier: GPN_WEBHOOK_URL secret'ı Discord/ntfy/Gotify gibi bir
      # uca işaret ederse, tünel sağlığı bozulduğunda bildirim gönderilir.
      - name: Notify failure (webhook)
        if: failure() && env.GPN_WEBHOOK_URL != ''
        shell: bash
        run: |
          best=$(grep '"event":"summary"' /tmp/gpn-probe.jsonl 2>/dev/null | head -1 | sed -n 's/.*"best":"\([^"]*\)".*/\1/p')
          printf '{"event":"ci_failure","repo":"%s","run_id":%s,"best":"%s"}' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$best" > /tmp/ci-payload.json
          curl -fsS -X POST -H 'Content-Type: application/json' -d @/tmp/ci-payload.json "$GPN_WEBHOOK_URL" \
            || echo "::warning::webhook bildirimi gönderilemedi"
