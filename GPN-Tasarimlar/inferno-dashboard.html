<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFERNO — Gaming Network</title>
<style>
:root{color-scheme:dark;--red:#ff1d2d;--green:#18e86b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000}body{overflow:auto;font-family:Arial,sans-serif}.viewer{min-height:100vh;min-width:1402px;display:flex;justify-content:center;align-items:flex-start;padding:0;background:#000}.stage{position:relative;width:1402px;height:1122px;flex:0 0 1402px;line-height:0;isolation:isolate}.reference{display:block;width:1402px;height:1122px;object-fit:fill;background:#030405}.hotspots{position:absolute;inset:0;z-index:2}.hotspot{position:absolute;display:block;margin:0;padding:0;border:0;border-radius:3px;background:transparent;cursor:pointer;line-height:normal;appearance:none}.hotspot:hover{background:rgba(255,28,43,.035);box-shadow:inset 0 0 0 1px rgba(255,35,48,.22),0 0 17px rgba(255,25,39,.12)}.hotspot:focus-visible{outline:1px solid #ff4652;box-shadow:0 0 0 3px rgba(255,28,43,.25)}.nav{left:.1%;width:12.6%;height:4.9%}.nav-1{top:17.4%}.nav-2{top:22.4%}.nav-3{top:27.4%}.nav-4{top:32.4%}.nav-5{top:37.4%}.nav-6{top:42.4%}.nav-7{top:47.4%}.nav-8{top:52.4%}.nav-9{top:57.4%}.gpn-mode{left:1%;top:61.2%;width:11.4%;height:18.8%}.network-guard{left:1%;top:81%;width:11.4%;height:15%}.status-card{left:17%;top:4.1%;width:20%;height:8.8%}.session-card{left:39.1%;top:3.9%;width:13.6%;height:8.7%}.ip-card{left:57.2%;top:4.1%;width:20.9%;height:8.8%}.window-actions{right:.3%;top:1.5%;width:13%;height:8.2%}.core-zone{left:35%;top:16%;width:34%;height:43%}.connect-button{left:42.2%;top:40.6%;width:17.5%;height:8.6%}.you-node{left:18.1%;top:31.5%;width:13.7%;height:16.4%}.server-node{left:64.5%;top:31.5%;width:13.7%;height:16.4%}.smart-route{left:37.5%;top:56.8%;width:27.3%;height:8.4%}.connection-stats{left:75%;top:13.2%;width:24.5%;height:22.4%}.route-map{left:75%;top:37.6%;width:24.5%;height:27.2%}.profiles{left:14.8%;top:65.2%;width:22.4%;height:30.4%}.traffic{left:37.8%;top:65.2%;width:32.2%;height:30.4%}.defense{left:68.2%;top:65.2%;width:29.8%;height:30.4%}.footer-server{left:.6%;top:96%;width:25%;height:4%}.footer-change{left:21.2%;top:95.4%;width:7.8%;height:4.9%}.footer-protocol{left:34%;top:95.5%;width:19%;height:4.7%}.footer-encryption{left:55%;top:95.5%;width:19%;height:4.7%}.footer-quality{right:.5%;top:95%;width:23%;height:5%}.ip-cover{display:none;position:absolute;z-index:4;left:61.3%;top:6.2%;width:9.7%;height:3.3%;background:#090a0b;color:#fff;text-align:center;font:700 clamp(10px,1.2vw,18px)/1.5 Arial;letter-spacing:.12em;box-shadow:0 0 0 1px rgba(255,25,40,.45)}.ip-hidden .ip-cover{display:block}.state-chip{display:none;position:absolute;z-index:4;left:43.8%;top:27.8%;width:15%;height:4%;align-items:center;justify-content:center;background:rgba(3,4,5,.9);color:var(--red);font:800 clamp(12px,1.3vw,20px)/1 Arial;letter-spacing:.08em;text-align:center;text-shadow:0 0 9px var(--red);border:1px solid rgba(255,29,45,.8)}.offline .state-chip{display:flex}.offline .connect-button{background:rgba(255,29,45,.05)}.flash{animation:flash .34s ease-out}@keyframes flash{0%{filter:brightness(1.35)}100%{filter:brightness(1)}}.toast{position:fixed;left:50%;bottom:22px;z-index:10;transform:translate(-50%,14px);opacity:0;pointer-events:none;padding:11px 17px;border:1px solid var(--red);border-radius:4px;background:rgba(10,11,12,.96);box-shadow:0 0 22px rgba(255,26,40,.35);color:#fff;font:600 12px Arial;transition:opacity .2s,transform .2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.missing{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#050607;color:#ff5260;font:600 14px Arial;text-align:center;line-height:1.5;padding:30px}.missing.show{display:flex}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1402px){.viewer{justify-content:flex-start}}@media(prefers-reduced-motion:reduce){.flash{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<main class="viewer" aria-label="Inferno Gaming Network dashboard">
 <section class="stage" id="stage">
  <img class="reference" id="reference" alt="Inferno Gaming Network dashboard reference" src="inferno-reference.png">
  <div class="missing" id="missing">Referans görseli yüklenemedi.<br>Beklenen dosya: inferno-reference.png</div>
  <div class="hotspots">
   <button class="hotspot nav nav-1" data-message="Dashboard selected" aria-label="Dashboard"></button>
   <button class="hotspot nav nav-2" data-message="Game Route selected" aria-label="Game Route"></button>
   <button class="hotspot nav nav-3" data-message="Servers selected" aria-label="Servers"></button>
   <button class="hotspot nav nav-4" data-message="Games selected" aria-label="Games"></button>
   <button class="hotspot nav nav-5" data-message="Statistics selected" aria-label="Statistics"></button>
   <button class="hotspot nav nav-6" data-message="Protection selected" aria-label="Protection"></button>
   <button class="hotspot nav nav-7" data-message="Settings selected" aria-label="Settings"></button>
   <button class="hotspot nav nav-8" data-message="Toolbox selected" aria-label="Toolbox"></button>
   <button class="hotspot nav nav-9" data-message="Account selected" aria-label="Account"></button>
   <button class="hotspot gpn-mode" data-message="GPN Mode opened" aria-label="GPN Mode"></button>
   <button class="hotspot network-guard" data-message="Network Guard opened" aria-label="Network Guard"></button>
   <button class="hotspot status-card" data-message="Protection status: active" aria-label="Protection status"></button>
   <button class="hotspot session-card" data-message="Session timer is running" aria-label="Session time"></button>
   <button class="hotspot ip-card" id="ipButton" data-message="IP address protected" aria-label="Hide IP address"></button>
   <button class="hotspot window-actions" data-message="Window controls activated" aria-label="Window controls"></button>
   <button class="hotspot core-zone" data-message="Connected through Singapore Gaming Edge" aria-label="Connection core"></button>
   <button class="hotspot connect-button" id="connectButton" aria-label="Disconnect or connect"></button>
   <button class="hotspot you-node" data-message="Local device node" aria-label="Your device"></button>
   <button class="hotspot server-node" data-message="Game server node" aria-label="Game server"></button>
   <button class="hotspot smart-route" data-message="AI Smart Route: optimal path active" aria-label="AI Smart Route"></button>
   <button class="hotspot connection-stats" data-message="Connection statistics refreshed" aria-label="Connection statistics"></button>
   <button class="hotspot route-map" data-message="Route map opened" aria-label="Route map"></button>
   <button class="hotspot profiles" data-message="Game profiles opened" aria-label="Game profiles"></button>
   <button class="hotspot traffic" data-message="Live traffic filter changed" aria-label="Live traffic"></button>
   <button class="hotspot defense" data-message="Defense Matrix inspected" aria-label="Defense Matrix"></button>
   <button class="hotspot footer-server" data-message="Current server: Singapore SG 01" aria-label="Current server"></button>
   <button class="hotspot footer-change" data-message="Server selector opened" aria-label="Change server"></button>
   <button class="hotspot footer-protocol" data-message="Inferno Protocol" aria-label="Protocol"></button>
   <button class="hotspot footer-encryption" data-message="AES-256-GCM encryption" aria-label="Encryption"></button>
   <button class="hotspot footer-quality" data-message="Route quality: excellent" aria-label="Route quality"></button>
  </div>
  <div class="ip-cover" id="ipCover">•••.•••.••.••</div>
  <div class="state-chip" id="stateChip">DISCONNECTED</div>
 </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="liveState">Connected</div>
<script>
(() => {
  const stage=document.getElementById('stage');
  const reference=document.getElementById('reference');
  const missing=document.getElementById('missing');
  const toast=document.getElementById('toast');
  const liveState=document.getElementById('liveState');
  let toastTimer;
  function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100);stage.classList.remove('flash');void stage.offsetWidth;stage.classList.add('flash')}
  reference.addEventListener('error',()=>{missing.classList.add('show');show('Reference image not found on this computer')});
  document.querySelectorAll('.hotspot').forEach(button=>button.addEventListener('click',()=>show(button.dataset.message||button.getAttribute('aria-label')||'Action completed')));
  document.querySelectorAll('.nav').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.nav').forEach(item=>item.classList.remove('selected'));button.classList.add('selected')}));
  let connected=true;
  document.getElementById('connectButton').addEventListener('click',(event)=>{event.stopPropagation();connected=!connected;stage.classList.toggle('offline',!connected);liveState.textContent=connected?'Connected':'Disconnected';show(connected?'GPN tunnel connected':'GPN tunnel disconnected')});
  let hidden=false;
  document.getElementById('ipButton').addEventListener('click',(event)=>{event.stopPropagation();hidden=!hidden;stage.classList.toggle('ip-hidden',hidden);show(hidden?'IP address hidden':'IP address visible')});
})();
</script>
</body>
</html>
