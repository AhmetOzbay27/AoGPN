name: build windows

# NOT: `v*` etiketi sürümleri artık release.yml tarafından derlenir, paketlenir ve
# yayımlanır. Bu dosyanın etiket tetikleyicisi bilerek KALDIRILDI — aksi halde
# aynı etikete iki iş akışı yazar ve GitHub Releases'te aynı varlık için yarış
# oluşur. Burada yalnızca dal itmelerinde derleme doğrulaması yapılır.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: build Windows (x64 arm64)
    uses: ./.github/workflows/build.yml
    with:
      target: windows
      project: ./AoGPN/AoGPN.csproj
